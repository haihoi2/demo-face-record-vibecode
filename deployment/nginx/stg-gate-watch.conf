# /usr/local/openresty/nginx/conf/conf.d/staging/stg-gate-watch.conf
#
# Edge TLS for the staging SmartFace / SmartLock gate watch gateway.
# Upstream: docker-compose app `smartface-local-gateway` on the dev host
#   -> http://192.168.6.52:8080 (container listens on 3000, APP_PORT=8080)
#
# Manual install:
#   1. DNS A/AAAA: stg-gate-watch.vota.vn -> edge OpenResty VIP
#   2. Ensure TLS covers stg-gate-watch.vota.vn. The existing ssl.conf is
#      provisioned for *.eton.vn; vota.vn is a DIFFERENT apex and almost
#      certainly needs a new certificate/SAN before this will serve.
#   3. Add https://stg-gate-watch.vota.vn to CORS_ALLOWED_ORIGINS in the
#      application's .env, then `docker compose up -d` on 192.168.6.52.
#   4. cp stg-gate-watch.conf /usr/local/openresty/nginx/conf/conf.d/staging/
#   5. openresty -t && systemctl reload openresty  (or your reload path)
#
# Notes:
#   - The upstream is a developer workstation, not a cluster workload. The
#     staging domain is only up while that machine and its containers are.
#   - Serving over HTTPS is what makes the browser camera work: getUserMedia
#     requires a secure context, so face scanning fails over plain HTTP on a
#     non-localhost hostname.
#   - The application has NO authentication on its API, including the lock
#     unlock endpoints, hence the eton.conf IP allowlist below.

log_format stg_gate_watch_loki escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"request_id":"$request_id",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"protocol":"$server_protocol",'
      '"status":$status,'
      '"bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"'
    '}';

upstream stg_gate_watch_backend {
    server 192.168.6.52:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name stg-gate-watch.vota.vn;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stg-gate-watch.vota.vn;

    # Face frames are posted as base64 JPEG; the app's express json limit is 50mb.
    client_max_body_size 50M;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;
    server_tokens off;

    include /usr/local/openresty/nginx/conf/iplist/proxy_pass.conf;
    include /usr/local/openresty/nginx/conf/iplist/ssl.conf;
    # Staging-only internal tool with no app-level auth - same IP allowlist as OMS portal.
    include /usr/local/openresty/nginx/conf/iplist/eton.conf;

    access_log /usr/local/openresty/nginx/logs/prod/stg-gate-watch.vota.vn_access.json.log
        stg_gate_watch_loki buffer=64k flush=1s;
    error_log /usr/local/openresty/nginx/logs/prod/stg-gate-watch.vota.vn_error.log;

    # -----------------------------------------------------------------------
    # Server-Sent Events: realtime scan/lock notifications.
    # Buffering must stay off or the client receives nothing until flush.
    # -----------------------------------------------------------------------
    location = /api/events {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://stg_gate_watch_backend;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # -----------------------------------------------------------------------
    # MJPEG camera proxy: an unbounded multipart stream, same buffering rules.
    # -----------------------------------------------------------------------
    location = /api/camera-streams/mjpeg {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://stg_gate_watch_backend;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://stg_gate_watch_backend;

        # RTSP snapshot grabs allow ffmpeg up to ~4.5s; keep headroom.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
