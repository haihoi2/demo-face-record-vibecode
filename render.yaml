services:
  - type: web
    name: demo-face-record-vibecode-api
    env: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FACE_RECOGNITION_PROVIDER
        value: local
      - key: DATA_DIR
        value: /var/data/smartface
