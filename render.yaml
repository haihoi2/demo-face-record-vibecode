services:
  - type: web
    name: demo-face-record-vibecode-api
    env: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-site.netlify.app
      - key: ETON_WEBHOOK_URL
        value: https://chat-room.eton.vn/hooks/YOUR_WEBHOOK_TOKEN
      - key: FACE_RECOGNITION_PROVIDER
        value: local
      - key: DATA_DIR
        value: /var/data/smartface
