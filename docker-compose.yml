# =============================================================================
# AI SmartFace & SmartLock Gateway - Docker Compose with PostgreSQL 18 Support
# =============================================================================
#
# CÁC KỊCH BẢN TRIỂN KHAI VỚI POSTGRESQL 18:
#
#   Kịch bản 1: Sử dụng PostgreSQL 18 Container chạy bằng Docker Compose (Khuyên dùng)
#     $ docker compose up -d --build
#
#   Kịch bản 2: Kết nối tới PostgreSQL 18 đã cài sẵn TRÊN MÁY LOCAL (Host OS / localhost:5432)
#     - Trong file .env, đặt:
#         DATABASE_URL=postgresql://postgres:mat_khau_cua_ban@host.docker.internal:5432/smartface_db
#     - Khởi động chỉ container app (tránh xung đột cổng 5432 với PostgreSQL trên máy host):
#         $ docker compose up -d --build smartface-app
#
#   Kịch bản 3: Chạy độc lập siêu nhẹ với Native SQLite (Không cần cài Postgres)
#     - Trong file .env, bỏ trống DATABASE_URL=
#     - Khởi động:
#         $ docker compose up -d --build smartface-app
#
#   QUYỀN GHI THƯ MỤC ./data (SQLite / JSON fallback):
#     Container chạy dưới user không phải root. Đặt APP_UID / APP_GID trong .env
#     bằng `id -u` / `id -g` của user sở hữu ./data trên máy host, rồi
#     `docker compose up -d --build` (giá trị này là build arg -> cần --build).
# =============================================================================

services:
  # ===========================================================================
  # 1. Main SmartFace AI & SmartLock Gateway Service
  # ===========================================================================
  smartface-app:
    image: smartface-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # uid/gid the app runs as inside the container. Set APP_UID / APP_GID in
        # .env to the HOST user that owns ./data (`id -u` / `id -g`) so the
        # bind-mounted SQLite database is writable. Default 1000 = stock `node` user.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: smartface-local-gateway
    restart: unless-stopped
    ports:
      # Cổng truy cập Web App trên máy host (mặc định 8080).
      # Container luôn lắng nghe cổng 3000 bên trong; cổng 80 do k3d chiếm giữ,
      # nginx reverse proxy sẽ trỏ về cổng này.
      - "${LAN_BIND_IP:-192.168.6.52}:${APP_PORT:-8080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DATA_DIR=/app/data

      # Cơ chế nhận diện khuôn mặt: "local" hoặc "google" (Gemini AI)
      # Demo-only unlock shortcuts. Never enable where a real lock is attached.
      - ALLOW_SIMULATED_RECOGNITION=${ALLOW_SIMULATED_RECOGNITION:-false}
      - ENABLE_DEMO_DATA=${ENABLE_DEMO_DATA:-false}
      - FACE_RECOGNITION_PROVIDER=${FACE_RECOGNITION_PROVIDER:-local}
      - LOCAL_FACE_RECOGNITION_MODEL=${LOCAL_FACE_RECOGNITION_MODEL:-local-exact-match}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GEMINI_MODEL=${GOOGLE_GEMINI_MODEL:-gemini-3.8-flash}

      # Camera credentials belong in the uncommitted environment, never source.
      # Storage-only floor for stranger snapshots; never affects access decisions.
      - FACE_STRANGER_MIN_QUALITY=${FACE_STRANGER_MIN_QUALITY:-}
      # Face size floors in pixels: any face (default 60), stored strangers (default 60).
      - FACE_MIN_SIZE_PX=${FACE_MIN_SIZE_PX:-}
      - FACE_STRANGER_MIN_SIZE_PX=${FACE_STRANGER_MIN_SIZE_PX:-}
      # Compression of the stored access-log photo (FFmpeg -q:v, 2-31; default 8).
      - SNAPSHOT_JPEG_QSCALE=${SNAPSHOT_JPEG_QSCALE:-}
      # NVR playback for access-history review (server-side only; see .env.example).
      - RECORDING_NVR_URL=${RECORDING_NVR_URL:-}
      - RECORDING_ENTRY_CHANNEL=${RECORDING_ENTRY_CHANNEL:-}
      - RECORDING_EXIT_CHANNEL=${RECORDING_EXIT_CHANNEL:-}
      - RECORDING_MAX_CONCURRENT=${RECORDING_MAX_CONCURRENT:-}
      - CAMERA_ENTRY_RTSP_URL=${CAMERA_ENTRY_RTSP_URL:-}
      - CAMERA_EXIT_RTSP_URL=${CAMERA_EXIT_RTSP_URL:-}

      # Eton Webhook thông báo kết quả chấm công
      - ETON_WEBHOOK_URL=${ETON_WEBHOOK_URL:-https://chat-room.eton.vn/hooks/YOUR_WEBHOOK_TOKEN}

      # Public URL of this app, used to build click-through links in webhook alerts
      - APP_URL=${APP_URL:-}

      # Operator auth for biometric images and stranger adjudication. Leave no
      # production deployment without an operator id/token: protected routes fail closed.
      - OPERATOR_ID=${OPERATOR_ID:-}
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - OPERATOR_SESSION_SECRET=${OPERATOR_SESSION_SECRET:-}
      - OPERATOR_COOKIE_CROSS_SITE=${OPERATOR_COOKIE_CROSS_SITE:-false}
      - VIEWER_ID=${VIEWER_ID:-}
      - VIEWER_TOKEN=${VIEWER_TOKEN:-}
      - DEVICE_INGEST_TOKEN=${DEVICE_INGEST_TOKEN:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}

      # -----------------------------------------------------------------------
      # Cấu hình chuỗi kết nối PostgreSQL 18:
      # - Mặc định kết nối tới container postgres:18 trong Docker network:
      #     postgresql://user:pass@postgres:5432/smartface_db
      # - Nếu dùng PostgreSQL 18 cài trên máy Host (Local Machine), đặt trong .env:
      #     DATABASE_URL=postgresql://postgres:password@host.docker.internal:5432/smartface_db
      # - Nếu để trống, hệ thống tự động chạy với SQLite 3 (./data/smartface.db)
      # -----------------------------------------------------------------------
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-smartface_user}:${POSTGRES_PASSWORD:-smartface_secret_pass}@postgres:5432/${POSTGRES_DB:-smartface_db}}

      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://gate-watch.vota.local:8080,http://gate-watch.vota.local,http://192.168.6.52:8080,https://stg-gate-watch.vota.vn}
    volumes:
      # Dữ liệu ảnh nhân viên, SQLite fallback, cấu hình luồng camera.
      # SMARTFACE_DATA_DIR moves it to another disk (host path); default ./data.
      - ${SMARTFACE_DATA_DIR:-./data}:/app/data
      # Đồng bộ múi giờ với máy tính chủ (TZ ở trên vẫn được ưu tiên; image đã có tzdata)
      - /etc/localtime:/etc/localtime:ro

    # Cho phép container kết nối trực tiếp đến PostgreSQL 18 đang chạy trên máy Host (host.docker.internal)
    # và các Camera IP LAN nội bộ (ví dụ: 192.168.60.2)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # USB Webcam passthrough trên Linux (nếu dùng camera cắm cổng USB trực tiếp vào máy chủ):
    # devices:
    #   - /dev/video0:/dev/video0

    depends_on:
      postgres:
        condition: service_healthy
        required: false

    healthcheck:
      # Debian slim ships neither wget nor curl; probe with Node itself.
      # Must target 127.0.0.1 (server binds IPv4 0.0.0.0; `localhost` may resolve to ::1).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - smartface-network

  # ===========================================================================
  # 2. Unit Test Runner (profile: test - never started by a plain `up`)
  #    $ docker compose --profile test run --rm tests
  # ===========================================================================
  tests:
    profiles: ["test"]
    image: smartface-tests:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    container_name: smartface-unit-tests
    command: ["npm", "test"]
    networks:
      - smartface-network

  # ===========================================================================
  # 3. PostgreSQL 18 Relational Database Container (Tùy chọn khi chưa có Postgres)
  # ===========================================================================
  postgres:
    # Hỗ trợ PostgreSQL 18 Alpine (hoặc chuyển đổi linh hoạt qua biến POSTGRES_IMAGE)
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: smartface-postgres-18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartface_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartface_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smartface_db}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      # Cổng PostgreSQL máy host (có thể đổi thành 5433 nếu máy host đã có Postgres 18 chạy cổng 5432)
      - "${LAN_BIND_IP:-192.168.6.52}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume lưu trữ dữ liệu PostgreSQL 18. SMARTFACE_PG_DATA = a host path
      # (e.g. on a data disk) replaces the named volume; unset keeps it.
      - ${SMARTFACE_PG_DATA:-postgres18_data}:/var/lib/postgresql/data
      # Script tự động khởi tạo cấu trúc bảng khi chạy lần đầu
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartface_user} -d ${POSTGRES_DB:-smartface_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartface-network

# =============================================================================
# Volume & Network
# =============================================================================
volumes:
  postgres18_data:
    name: smartface_postgres18_data
    driver: local

networks:
  smartface-network:
    name: smartface-network
    driver: bridge
